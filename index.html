<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Delivery Dash</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="device-wrapper">
    <div id="game-container">
      <canvas id="gameCanvas" width="360" height="640"></canvas>

      <div id="ui-overlay">
        <div class="hud-top">
          <div class="scoreboard">
            <span>Distance: <span id="score">0</span>m</span>
            <span id="timer-container" class="timer-box hidden">⏱️ <span id="timer">--</span>s</span>
            <span class="coin-count">🪙 <span id="coins">0</span></span>
          </div>
        </div>

        <div class="controls">
          <div class="btn-arrow" id="leftBtn"><div class="arrow-left"></div></div>
          <div class="btn-arrow" id="rightBtn"><div class="arrow-right"></div></div>
        </div>
      </div>

      <!-- Start Screen / Garage -->
      <div id="start-screen" class="modal-screen">
        <div class="header-badge">3D Arcade Runner</div>
        <h1 class="modal-title">Delivery Dash</h1>
        <p style="color: #aaa; font-size: clamp(11px, 3.2vw, 13px); font-weight: 600; margin-bottom: 4px;">Choose your ride & rush through traffic!</p>
        
        <div class="garage-selection">
          <button class="nav-arrow-btn" id="prevVehicleBtn">◄</button>
          <div class="scooter-preview-box">
            <canvas id="scooter-preview" width="110" height="140"></canvas>
          </div>
          <button class="nav-arrow-btn" id="nextVehicleBtn">►</button>
        </div>
        <div class="vehicle-title" id="vehicleTitle">Delivery Scooter</div>

        <div style="font-size: 11px; color: #ff9f1a; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px;">Select Difficulty</div>
        <div class="mode-carousel">
          <button class="nav-arrow-btn" id="prevModeBtn">◄</button>
          <div class="mode-display" id="modeTitle">Newbie 😇</div>
          <button class="nav-arrow-btn" id="nextModeBtn">►</button>
        </div>

        <button class="primary-btn" id="startBtn">Play!</button>
        
      </div>

      <!-- Respawn Screen -->
      <div id="respawn-screen" class="modal-screen hidden">
        <h1 class="modal-title" style="color: #ffd700;">RESPAWN?</h1>
        <p id="respawn-reason" style="color: #aaa; margin-bottom: 8px; font-size: clamp(12px, 3.2vw, 14px); font-weight: 600;"></p>
        
        <div style="margin: 16px 0; font-size: 16px; color: #fff; font-weight: 700;">
          Spend <span style="color: #ffd700; font-weight: 900;">50 Coins</span> to clear obstacles and continue?
        </div>

        <div class="modal-btn-group">
          <button class="secondary-btn" id="skipRespawnBtn">Give Up</button>
          <button class="primary-btn" id="useRespawnBtn" style="background: linear-gradient(135deg, #ff9f1a, #ff793f);">RESPAWN (50 🪙)</button>
        </div>
      </div>

      <!-- Game Over Screen -->
      <div id="game-over-screen" class="modal-screen hidden">
        <h1 id="crash-title" class="modal-title" style="color: #ff4757;">DELIVERY FAILED!</h1>
        <p id="crash-reason" style="color: #aaa; margin-bottom: 4px; font-size: clamp(12px, 3.2vw, 14px); font-weight: 600;"></p>

        <div class="stats-card">
          <div class="stat-row">
            <span>Difficulty:</span>
            <span class="badge-difficulty" id="end-difficulty">Newbie</span>
          </div>
          <div class="stat-row">
            <span>Time Elapsed:</span>
            <span class="stat-value" id="end-time">00:00</span>
          </div>
          <div class="stat-row">
            <span>Distance Covered:</span>
            <span class="stat-value" id="final-score" style="color: #1dd1a1;">0m</span>
          </div>
          <div class="stat-row">
            <span>Coins Collected:</span>
            <span class="stat-value" id="final-coins" style="color: #ffd700;">0</span>
          </div>
        </div>

        <div class="modal-btn-group">
          <button class="secondary-btn" id="menuBtn" title="Back to Menu">←</button>
          <button class="primary-btn" id="restartBtn">RETRY</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
